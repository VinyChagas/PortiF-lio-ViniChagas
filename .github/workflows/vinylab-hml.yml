name: VinyLab HML

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: vinylab-portfolio-hml
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, deploy HML
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Manifest
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml jsonschema
          python3 scripts/validate-manifest.py

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vinychagas/portfolio:${{ github.sha }}
          build-args: |
            VITE_STUDIO_PUBLIC_API=https://control.vinichagas.cloud/api/portfolio/public
            VITE_HML_STATIC_PREVIEW=true

      - name: Deploy on the VPS
        env:
          DEPLOY_KEY: ${{ secrets.HML_DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_KEY}"
          echo "::add-mask::${GHCR_TOKEN}"
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -H 177.7.34.178 > "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            vinylab-deploy@177.7.34.178 \
            "ops-deploy portfolio hml ${GITHUB_SHA}"
          rm -f "$RUNNER_TEMP/deploy_key"

      - name: Report deploy to Control Center
        if: always()
        env:
          OPS_EVENTS_TOKEN: ${{ secrets.VINYLAB_OPS_EVENTS_TOKEN }}
          REPORTED_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_EVENTS_TOKEN:-}" ]; then
            echo "VINYLAB_OPS_EVENTS_TOKEN ausente — pulando ingestão no Control Center"
            exit 0
          fi
          echo "::add-mask::${OPS_EVENTS_TOKEN}"
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "slug": "portfolio",
            "environment": "hml",
            "sha": os.environ["GITHUB_SHA"],
            "reportedStatus": os.environ["REPORTED_STATUS"],
            "githubRunId": int(os.environ["GITHUB_RUN_ID"]),
            "githubWorkflow": os.environ.get("GITHUB_WORKFLOW", "VinyLab HML"),
            "githubRepository": os.environ["GITHUB_REPOSITORY"],
            "imageRef": f"ghcr.io/vinychagas/portfolio:{os.environ['GITHUB_SHA']}",
            "workflowUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "errorMessage": None if os.environ["REPORTED_STATUS"] == "success" else "GitHub Actions job failed",
          }))
          PY
          )
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${OPS_EVENTS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "https://control.vinichagas.cloud/api/operations/events/github"
