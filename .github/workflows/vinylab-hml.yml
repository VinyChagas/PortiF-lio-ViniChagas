name: VinyLab HML

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: vinylab-portfolio-hml
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, deploy HML
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Manifest
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml jsonschema
          python3 scripts/validate-manifest.py

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vinychagas/portfolio:${{ github.sha }}

      - name: Deploy on the VPS
        env:
          DEPLOY_KEY: ${{ secrets.HML_DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_KEY}"
          echo "::add-mask::${GHCR_TOKEN}"
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -H 177.7.34.178 > "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            vinylab-deploy@177.7.34.178 \
            "ops-deploy portfolio hml ${GITHUB_SHA}"
          rm -f "$RUNNER_TEMP/deploy_key"
